name: propmatch

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-propmatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propmatch}"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  etl:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.etl
    env_file:
      - ../../.env
    volumes:
      - ../../src:/app/src
      - ../../data:/app/data
      - ../../notebooks:/app/notebooks
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  dbt:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dbt
    env_file:
      - ../../.env
    volumes:
      - ../../dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy

  jupyter:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.etl
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
    env_file:
      - ../../.env
    volumes:
      - ../../notebooks:/app/notebooks
      - ../../data:/app/data
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
